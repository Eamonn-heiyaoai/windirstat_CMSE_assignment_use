
name: Python Pipeline Tests

on:
  push:
    branches:
      - master
      - "a2/iter1/python-ci"
  pull_request:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run automated tests
        run: python -m unittest ai_pipeline.test_pipeline -v
